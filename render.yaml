services:
  - type: web
    name: fieldflow-ortools
    runtime: python
    plan: free
    region: frankfurt
    rootDir: solver_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
  - type: web
    name: fieldflow-web
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:render
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: NODE_ENV
        value: production
      - key: DEPLOY_TARGET
        value: node
      - key: SOLVER_URL
        value: https://fieldflow-ortools.onrender.com
