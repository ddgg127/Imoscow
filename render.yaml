services:
  - type: web
    name: fieldflow-ortools
    runtime: python
    plan: free
    region: frankfurt
    rootDir: solver_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
  - type: web
    name: fieldflow-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/solver
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: NODE_ENV
        value: production
      - key: DEPLOY_TARGET
        value: node
      - key: SOLVER_URL
        value: http://127.0.0.1:8008
